<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">AI Memory Challenge</title>
<desc id="desc">Um pequeno jogo de memória criado por Geovanna com conceitos de inteligência artificial.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9468F"/><stop offset=".55" stop-color="#7257D9"/><stop offset="1" stop-color="#2786B8"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26324A" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1200" height="270" rx="22" fill="#FBFAFD"/>
<rect width="1200" height="270" rx="22" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="268" rx="21" fill="none" stroke="#E2E4EA" stroke-width="2"/>
<g transform="translate(60 54)">
  <rect x="0" y="24" width="92" height="122" rx="14" fill="#172033"/>
  <text x="46" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">AI</text>
  <g>
    <rect x="108" y="0" width="92" height="122" rx="14" fill="url(#accent)"/>
    <text x="154" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">RAG</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3s" repeatCount="indefinite"/>
  </g>
</g>
<g font-family="Arial,Segoe UI,sans-serif" transform="translate(330 55)">
  <text x="0" y="0" dominant-baseline="hanging" fill="#7257D9" font-size="14" font-weight="700" letter-spacing="3">UM INTERVALO ENTRE OS PROJETOS</text>
  <text x="0" y="52" dominant-baseline="hanging" fill="#172033" font-size="36" font-weight="750">AI Memory Challenge</text>
  <text x="0" y="108" dominant-baseline="hanging" fill="#596174" font-size="19">Um jogo curto com conceitos que aparecem na minha rotina de estudos e trabalho.</text>
  <rect x="0" y="158" width="170" height="42" rx="8" fill="#172033"/>
  <text x="85" y="185" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">JOGAR  →</text>
</g>
<path d="M1174 27v216" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
</svg>