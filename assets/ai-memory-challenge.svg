<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AI Memory Challenge</title>
  <desc id="desc">Convite para jogar um desafio de memória sobre Inteligência Artificial</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF2F8"/>
      <stop offset=".48" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EC4899"/>
      <stop offset=".52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6D28D9" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <path d="M0 238C184 177 320 291 506 231S827 173 1200 242V300H0Z" fill="#fff" opacity=".66"/>
  <g opacity=".22" fill="#8B5CF6">
    <circle cx="70" cy="55" r="4"><animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="64" r="5"><animate attributeName="opacity" values=".8;.2;.8" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="242" r="3"><animate attributeName="opacity" values=".2;.8;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(70 52)" filter="url(#shadow)">
    <g>
      <rect width="118" height="154" rx="20" fill="#fff" stroke="#E9D5FF" stroke-width="2"/>
      <text x="59" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#8B5CF6">AI</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(142 28)">
      <rect width="118" height="154" rx="20" fill="url(#accent)"/>
      <text x="59" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">RAG</text>
      <text x="59" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff">encontre o par</text>
      <animateTransform attributeName="transform" type="translate" values="142 28;142 35;142 28" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="400" y="92" font-size="20" font-weight="700" fill="#7C3AED" letter-spacing="2">EXPLORE UM POUCO MAIS</text>
    <text x="400" y="143" font-size="38" font-weight="700" fill="#111827">AI Memory Challenge</text>
    <text x="400" y="184" font-size="20" fill="#374151">Teste sua memória com conceitos que fazem parte da minha jornada em IA.</text>
    <g transform="translate(400 211)">
      <rect width="210" height="50" rx="25" fill="url(#accent)"/>
      <text x="105" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">JOGAR AGORA  →</text>
    </g>
  </g>
</svg>