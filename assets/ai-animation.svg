<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="230" viewBox="0 0 1400 230" role="img" aria-labelledby="title desc">
<title id="title">Inteligência Artificial em movimento</title><desc id="desc">Fluxo animado conectando dados, contexto, modelos e soluções úteis.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF8FC"/><stop offset=".52" stop-color="#F5F3FF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EC4899"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="230" rx="28" fill="url(#bg)" stroke="#E5E7EB"/>
<text x="70" y="67" fill="#111827" font-size="25" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif">Meu foco em IA</text>
<text x="70" y="101" fill="#6B7280" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Conectar conhecimento técnico, contexto e experiência do usuário.</text>
<path d="M410 145 C520 45 610 45 700 145 S900 245 1010 145 S1190 45 1300 145" fill="none" stroke="#D8D4E8" stroke-width="5" stroke-linecap="round"/>
<path d="M410 145 C520 45 610 45 700 145 S900 245 1010 145 S1190 45 1300 145" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 900" filter="url(#glow)">
<animate attributeName="stroke-dashoffset" values="0;-980" dur="5s" repeatCount="indefinite"/>
</path>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
<g><circle cx="410" cy="145" r="34" fill="#fff" stroke="#EC4899" stroke-width="3"/><text x="410" y="151" fill="#BE185D" font-size="15" font-weight="700">DADOS</text><circle cx="410" cy="145" r="40" fill="none" stroke="#EC4899" opacity=".25"><animate attributeName="r" values="38;48;38" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".28;0;.28" dur="3s" repeatCount="indefinite"/></circle></g>
<g><circle cx="700" cy="145" r="34" fill="#fff" stroke="#8B5CF6" stroke-width="3"/><text x="700" y="151" fill="#6D28D9" font-size="15" font-weight="700">CONTEXTO</text><circle cx="700" cy="145" r="40" fill="none" stroke="#8B5CF6" opacity=".25"><animate attributeName="r" values="38;48;38" dur="3s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".28;0;.28" dur="3s" begin=".8s" repeatCount="indefinite"/></circle></g>
<g><circle cx="1010" cy="145" r="34" fill="#fff" stroke="#6366F1" stroke-width="3"/><text x="1010" y="151" fill="#4F46E5" font-size="15" font-weight="700">MODELOS</text><circle cx="1010" cy="145" r="40" fill="none" stroke="#6366F1" opacity=".25"><animate attributeName="r" values="38;48;38" dur="3s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".28;0;.28" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle></g>
<g><circle cx="1300" cy="145" r="34" fill="#fff" stroke="#2563EB" stroke-width="3"/><text x="1300" y="151" fill="#1D4ED8" font-size="15" font-weight="700">SOLUÇÃO</text><circle cx="1300" cy="145" r="40" fill="none" stroke="#2563EB" opacity=".25"><animate attributeName="r" values="38;48;38" dur="3s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".28;0;.28" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle></g>
</g>
</svg>