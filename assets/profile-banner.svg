<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<title id="title">Geovanna Eduarda da Silva</title>
<desc id="desc">Engenharia de Software, Inteligência Artificial e Produtos Digitais. Transformando ideias em soluções digitais úteis, acessíveis e inovadoras.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF7FB"/>
    <stop offset=".48" stop-color="#F5F3FF"/>
    <stop offset="1" stop-color="#EFF6FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#EC4899"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#2563EB"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6D28D9" flood-opacity=".14"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8B5CF6" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1400" height="480" rx="34" fill="url(#bg)"/>
<rect width="1400" height="480" rx="34" fill="url(#grid)"/>
<circle cx="1250" cy="80" r="170" fill="#EC4899" opacity=".08"/>
<circle cx="110" cy="440" r="210" fill="#38BDF8" opacity=".09"/>
<g transform="translate(925 92)" filter="url(#shadow)">
  <rect width="360" height="260" rx="24" fill="#FFFFFF" stroke="#D8DDF0" stroke-width="2"/>
  <circle cx="30" cy="28" r="6" fill="#EC4899"/><circle cx="50" cy="28" r="6" fill="#8B5CF6"/><circle cx="70" cy="28" r="6" fill="#38BDF8"/>
  <text x="28" y="82" fill="#8B5CF6" font-size="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">const professional = {</text>
  <text x="48" y="122" fill="#111827" font-size="19" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">software: true,</text>
  <text x="48" y="160" fill="#111827" font-size="19" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">ai: true,</text>
  <text x="48" y="198" fill="#111827" font-size="19" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">impact: "positive"</text>
  <text x="28" y="236" fill="#8B5CF6" font-size="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">};</text>
</g>
<rect x="92" y="87" width="92" height="8" rx="4" fill="url(#accent)"/>
<text x="92" y="172" fill="#111827" font-size="55" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">Geovanna Eduarda da Silva</text>
<text x="92" y="228" fill="#4B5563" font-size="29" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Engenharia de Software · Inteligência Artificial · Produtos Digitais</text>
<text x="92" y="292" fill="#374151" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">Transformando ideias em soluções digitais úteis,</text>
<text x="92" y="326" fill="#374151" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">acessíveis e inovadoras.</text>
<g transform="translate(92 374)">
