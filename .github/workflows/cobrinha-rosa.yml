name: Gerar cobrinha rosa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cobrinha-rosa.yml
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: cobrinha-rosa
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar arquivos do perfil
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Gerar SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: geovannasilva15
          outputs: dist/cobrinha-rosa.svg?color_snake=%23ff69b4&color_dots=%233b2233,%23f9a8d4,%23f472b6,%23ec4899,%23be185d
      - name: Atualizar somente a animação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/cobrinha-rosa.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Atualizar cobrinha rosa"
          git pull --rebase origin main
          git push origin HEAD:main
